name: Release kernel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libssl-dev bc cpio device-tree-compiler \
            clang lld llvm ccache zip

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('kernel_source/arch/arm64/configs/r11s_ksun_susfs_defconfig') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=cache_dir=~/.ccache
          ccache --set-config=max_size=2G
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Fetch pinned KernelSU-Next and align Manager version
        run: bash .github/scripts/prepare-ksun.sh

      - name: Verify official Manager build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/KernelSU-Next/KernelSU-Next/actions/runs/38150809852 > /tmp/ksun-manager-run.json
          python3 - <<'PYCODE'
          import json
          with open('/tmp/ksun-manager-run.json') as f:
              run = json.load(f)
          assert run['head_sha'] == '3f64b8ce28279ed96118212bdbfc49010dbc8936', run['head_sha']
          assert run['conclusion'] == 'success', run['conclusion']
          PYCODE
          rm -rf manager_apk

      - name: Download official Manager APKs from the matching commit
        uses: actions/download-artifact@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          run-id: 38150809852
          artifact-ids: '11706766540,11707175560'
          github-token: ${{ github.token }}
          path: manager_apk
          merge-multiple: true

      - name: Verify Manager pair and record provenance
        run: |
          test -f manager_apk/KernelSU_Next_v3.4.1-6-g3f64b8ce_33339-release.apk
          test -f manager_apk/KernelSU_Next_v3.4.1-6-g3f64b8ce-spoofed_33339-release.apk
          printf '%s\n' \
            'KernelSU: pershoot/KernelSU-Next@188cf08dae644d6ede3806c258b7af11d36dca93' \
            'Managers: KernelSU-Next/KernelSU-Next@3f64b8ce28279ed96118212bdbfc49010dbc8936' \
            'Official Manager workflow run: 38150809852' \
            'Kernel and Manager version code: 33339' > manager_apk/provenance.txt
          sha256sum manager_apk/*.apk >> manager_apk/provenance.txt

      - name: Configure kernel
        working-directory: kernel_source
        run: |
          make ARCH=arm64 O=out LLVM=1 r11s_ksun_susfs_defconfig
          make ARCH=arm64 O=out LLVM=1 olddefconfig

      - name: Build kernel
        working-directory: kernel_source
        run: |
          make ARCH=arm64 O=out LLVM=1 CC="ccache clang" -j$(nproc) Image

      - name: Verify usb_disable_autosuspend export (regression guard)
        working-directory: kernel_source
        run: |
          nm out/vmlinux | grep -E "__ksymtab_usb_disable_autosuspend|T usb_disable_autosuspend" \
            || { echo "::error::usb_disable_autosuspend export missing - TRIM_UNUSED_KSYMS regression?"; exit 1; }

      - name: Package AnyKernel3 zip
        run: |
          cp -r anykernel3_template ak3_out
          cp kernel_source/out/arch/arm64/boot/Image ak3_out/Image
          cd ak3_out
          zip -r9 "../r11s-LineageOS-KSUN-SUSFS-${GITHUB_REF_NAME}.zip" . -x '*.git*'

      - name: Resolve release notes
        id: notes
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No prewritten notes for $GITHUB_REF_NAME, using auto-generated notes only."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            r11s-LineageOS-KSUN-SUSFS-*.zip
            manager_apk/*.apk
            manager_apk/provenance.txt
          body_path: ${{ steps.notes.outputs.path || null }}
          generate_release_notes: true
          fail_on_unmatched_files: true
