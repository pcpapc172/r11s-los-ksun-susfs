name: Fetch textbook PDF

on:
  workflow_dispatch:
  push:
    branches:
      - claude/karofanavari-7-modules-u339vq
    paths:
      - '.github/workflows/fetch-pdf.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF
        run: |
          mkdir -p tmp-download
          curl -L -A "Mozilla/5.0" -o tmp-download/Karofanavari-7_Daneshchi.iR.pdf "https://dl.daneshchi.ir/file/chap-school/Karofanavari-7_Daneshchi.iR.pdf"
          ls -la tmp-download
          file tmp-download/Karofanavari-7_Daneshchi.iR.pdf
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: karofanavari7-pdf
          path: tmp-download/Karofanavari-7_Daneshchi.iR.pdf
          retention-days: 3
      - name: Commit PDF to branch
        run: |
          mkdir -p tmp-textbook
          cp tmp-download/Karofanavari-7_Daneshchi.iR.pdf tmp-textbook/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tmp-textbook/Karofanavari-7_Daneshchi.iR.pdf
          git commit -m "Add downloaded textbook PDF (temporary, for content extraction)"
          git push origin HEAD:claude/karofanavari-7-modules-u339vq
